name: Backend dependency, secret, and configuration scans

# Called independently of compilation so build failures do not suppress source scans.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  source-security:
    name: Backend dependency, secret, and configuration scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify CI helper scripts
        # Check safe diagnostics and bounded resolution retries before running scanners.
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Set up Java for dependency resolution
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21.0.12+101.0.LTS"
          cache: maven
          # Share caches only when module dependencies and Maven wrapper settings match.
          cache-dependency-path: |
            backend/**/pom.xml
            backend/**/.mvn/wrapper/maven-wrapper.properties

      - name: Resolve backend dependencies before scanning
        # Populate parent/BOM and reactor artifacts so Trivy can resolve the full graph locally.
        # Retry resolution failures at most three times; preserve compiler failures and final exit codes.
        run: bash .github/scripts/maven_with_retry.sh sh backend/services/connector-service/mvnw -f backend/pom.xml -DskipTests install

      - name: Scan backend dependencies, secrets, and Docker configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          version: v0.70.0
          scan-ref: backend
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: backend-filesystem-security.json

      - name: Scan shared infrastructure configuration
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          version: v0.70.0
          scan-ref: .
          skip-dirs: .cache,frontend/node_modules,frontend/dist,backend/services/connector-service/target,backend/services/change-service/target,backend/event-contracts/target,backend/docker/schema-registry/target
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: backend-configuration-security.json

      - name: Print source security findings
        if: always()
        run: python3 .github/scripts/summarize_trivy.py backend-filesystem-security.json backend-configuration-security.json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-source-security
          path: backend-*-security.json
          if-no-files-found: warn
          retention-days: 7
