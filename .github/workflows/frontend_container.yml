name: Frontend container build, smoke test, and security scan

# Build and run the image in one job so smoke tests and scans inspect the same build.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  container:
      # Build, smoke-test, and scan the frontend container image.
    name: Frontend container build, smoke test, and security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.37.1
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Build frontend image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          load: true
          push: false
          tags: changuard-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke test frontend container
        run: |
          docker run --detach --name frontend-ci --publish 127.0.0.1:5173:5173 changuard-frontend:ci
          curl --fail --silent --show-error --retry 24 --retry-delay 5 --retry-all-errors http://localhost:5173/

      - name: Scan image OS packages, npm dependencies, and secrets
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: changuard-frontend:ci
          version: v0.70.0
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: frontend-container-security.json

      - name: Summarize container security findings
        # Log package versions and available fixes without printing secret matches from the JSON artifact.
        if: always() && steps.build.outcome == 'success'
        run: python3 .github/scripts/summarize_trivy.py frontend-container-security.json

      - name: Upload container security report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-container-security
          path: frontend-container-security.json
          if-no-files-found: warn
          retention-days: 7

      - name: Container diagnostics and cleanup
        if: always()
        run: |
          if docker container inspect frontend-ci > /dev/null 2>&1; then
            docker logs frontend-ci
            docker rm --force frontend-ci
          fi
