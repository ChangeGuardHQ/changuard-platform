name: Frontend verification

# Reusable checks for the frontend package; callers decide when to run this workflow.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        # Key the npm cache from the same lockfile consumed by npm ci.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        # Continue independent checks after lint failures if dependency installation succeeded.
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck

      - name: Unit and integration tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        # Write a JUnit report so CI systems can collect the test results.
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/vitest.xml

      - name: Build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build

      - name: Upload test reports
        # Preserve reports produced before a failure or cancellation.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-test-reports
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
