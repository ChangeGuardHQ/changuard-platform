name: Frontend CI
# Runs frontend quality checks, security scans, and a container smoke test.

on:
  pull_request:
    paths:
      - ".github/workflows/frontend_ci.yml"
      - "frontend/**"
      - "docker-compose.yaml"
  push:
    paths:
      - ".github/workflows/frontend_ci.yml"
      - "frontend/**"
      - "docker-compose.yaml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validate source changes and retain unit/integration test reports.
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck

      - name: Unit and integration tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/vitest.xml

      - name: Build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-test-reports
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  source-security:
      # Audit frontend dependencies and scan frontend/shared configuration.
    name: Frontend dependency, secret, and configuration scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high --json > npm-audit.json

      - name: Filesystem, secret, and dependency security scan
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          version: v0.70.0
          scan-ref: frontend
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: frontend-filesystem-security.json

      - name: Scan shared infrastructure configuration
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          version: v0.70.0
          scan-ref: .
          skip-dirs: .cache,frontend/node_modules,frontend/dist,backend/services/connector-service/target
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: frontend-configuration-security.json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-source-security
          path: |
            frontend/npm-audit.json
            frontend-*-security.json
          if-no-files-found: warn
          retention-days: 7

  sast:
      # Apply pinned Semgrep rules to frontend JavaScript and TypeScript sources.
    name: Frontend source security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out pinned Semgrep security rules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: semgrep/semgrep-rules
          ref: a84ff9cc2453ca91d581380de4b8b3f272f6f4be # 2026-09-22
          path: .security-rules
          sparse-checkout: |
            javascript/lang/security
            javascript/browser/security
            typescript/lang/security
            typescript/react/security
          persist-credentials: false

      - name: Scan JavaScript, TypeScript, and React sources
        env:
          SEMGREP_IMAGE: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-sast"
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$RUNNER_TEMP/frontend-sast:/reports" \
            --workdir /src \
            --env HOME=/tmp \
            --env SEMGREP_ENABLE_VERSION_CHECK=0 \
            --env SEMGREP_SEND_METRICS=off \
            "$SEMGREP_IMAGE" \
            semgrep scan --oss-only --metrics=off --disable-version-check --strict --error \
              --config .security-rules/javascript/lang/security \
              --config .security-rules/javascript/browser/security \
              --config .security-rules/typescript/lang/security \
              --config .security-rules/typescript/react/security \
              --json-output=/reports/semgrep.json \
              --sarif-output=/reports/semgrep.sarif frontend

      - name: Upload source security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-sast
          path: ${{ runner.temp }}/frontend-sast/
          if-no-files-found: warn
          retention-days: 7

  codeql:
      # Upload CodeQL findings when repository security features are available.
    name: Frontend CodeQL analysis
    # Private repositories need GitHub Code Security enabled before opting in.
    if: ${{ github.event.repository.visibility == 'public' || vars.CODEQL_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.1/codeql-bundle-linux64.tar.gz
          build-mode: none
          source-root: frontend
          queries: security-extended

      - name: Analyze JavaScript and TypeScript sources
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:javascript-typescript
          output: ${{ github.workspace }}/codeql-results

      - name: Upload CodeQL report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-codeql
          path: codeql-results/*.sarif
          if-no-files-found: warn
          retention-days: 7

  container:
      # Build, smoke-test, and scan the frontend container image.
    name: Frontend container build, smoke test, and security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.1

      - name: Build frontend image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          load: true
          push: false
          tags: changuard-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke test frontend container
        run: |
          docker run --detach --name frontend-ci --publish 127.0.0.1:5173:5173 changuard-frontend:ci
          curl --fail --silent --show-error --retry 24 --retry-delay 5 --retry-all-errors http://localhost:5173/

      - name: Scan image OS packages, npm dependencies, and secrets
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: changuard-frontend:ci
          version: v0.70.0
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: frontend-container-security.json

      - name: Upload container security report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-container-security
          path: frontend-container-security.json
          if-no-files-found: warn
          retention-days: 7

      - name: Container diagnostics and cleanup
        if: always()
        run: |
          if docker container inspect frontend-ci > /dev/null 2>&1; then
            docker logs frontend-ci
            docker rm --force frontend-ci
          fi
