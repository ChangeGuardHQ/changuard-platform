name: Frontend CI

# This entry point owns triggers and orchestration; reusable workflows own the checks.
on:
  # Include reusable workflow edits so changing a check also exercises that check.
  pull_request:
    paths:
      - ".github/workflows/frontend_*.yml"
      - "frontend/**"
      - "docker-compose.yaml"
      - "deploy/**"
  push:
    paths:
      - ".github/workflows/frontend_*.yml"
      - "frontend/**"
      - "docker-compose.yaml"
      - "deploy/**"
  # Refresh security results weekly even when application code has not changed.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Calls use a read-only token unless a job explicitly requests additional access.
permissions:
  contents: read

# Keep this group only in the caller: reused workflows share its github.workflow value.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Independent calls let tests, security scans, and container checks report separately.
jobs:
  frontend:
    name: Frontend verification
    uses: ./.github/workflows/frontend_verify.yml

  source-security:
    name: Frontend dependency, secret, and configuration scans
    uses: ./.github/workflows/frontend_source_security.yml

  sast:
    name: Frontend source security scan
    uses: ./.github/workflows/frontend_sast.yml

  codeql:
    name: Frontend CodeQL analysis
    # Private repositories need GitHub Code Security enabled before opting in.
    if: ${{ github.event.repository.visibility == 'public' || vars.CODEQL_ENABLED == 'true' }}
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: ./.github/workflows/frontend_codeql.yml

  container:
    name: Frontend container build, smoke test, and security scan
    uses: ./.github/workflows/frontend_container.yml
