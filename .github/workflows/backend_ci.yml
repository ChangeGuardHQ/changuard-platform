name: Backend CI

# This entry point owns triggers and orchestration; reusable workflows own the checks.
on:
  # Include reusable workflow edits so changing a check also exercises that check.
  pull_request:
    paths:
      - ".github/workflows/backend_*.yml"
      # Report-summary changes need the same validation as the scanners that use them.
      - ".github/scripts/**"
      - "backend/**"
      - "docker-compose.yaml"
  push:
    paths:
      - ".github/workflows/backend_*.yml"
      - ".github/scripts/**"
      - "backend/**"
      - "docker-compose.yaml"
  # Refresh security results weekly even when application code has not changed.
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

# Calls use a read-only token unless a job explicitly requests additional access.
permissions:
  contents: read

# Keep this group only in the caller: reused workflows share its github.workflow value.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Independent calls let tests, security scans, and container checks report separately.
jobs:
  backend:
    name: Backend verification
    uses: ./.github/workflows/backend_verify.yml

  source-security:
    name: Backend dependency, secret, and configuration scans
    uses: ./.github/workflows/backend_source_security.yml

  sast:
    name: Backend source security scan
    uses: ./.github/workflows/backend_sast.yml

  codeql:
    name: Backend CodeQL analysis
    # Private repositories must enable GitHub Code Security and set the repository
    # variable CODEQL_ENABLED to the string "true" to opt in. Otherwise, CodeQL is skipped.
    if: ${{ github.event.repository.visibility == 'public' || vars.CODEQL_ENABLED == 'true' }}
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: ./.github/workflows/backend_codeql.yml

  container:
    name: Backend container build, smoke test, and security scan
    uses: ./.github/workflows/backend_container.yml
