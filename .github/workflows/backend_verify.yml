name: Backend verification

# Called by backend_ci.yml; the entry point controls scheduling and cancellation.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Preserve main's mirrored cleanup helper for Testcontainers integration tests.
      TESTCONTAINERS_RYUK_CONTAINER_IMAGE: mirror.gcr.io/testcontainers/ryuk@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
    # Let both services finish so one failure does not hide the other's reports.
    strategy:
      fail-fast: false
      matrix:
        service: [connector-service, change-service]
    # Select each service through the reactor so shared dependencies build with it.
    defaults:
      run:
        working-directory: backend/services/${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21.0.12+101.0.LTS" # Temurin 21.0.12.1+1 (Adoptium SemVer)
          cache: maven
          # Wrapper changes must invalidate caches written with different Resolver metadata.
          cache-dependency-path: |
            backend/**/pom.xml
            backend/**/.mvn/wrapper/maven-wrapper.properties

      - name: Build PostgreSQL test image
        run: docker build --tag changuard-postgres:18.6-security.1 ../../docker/postgres

      - name: Build connector integration images
        # Only connector tests need the real Kafka/Registry wire protocol infrastructure.
        if: matrix.service == 'connector-service'
        run: |
          docker build --tag changuard-kafka:4.2.2-security.2 ../../docker/kafka
          docker build --file ../../docker/schema-registry/Dockerfile --tag changuard-schema-registry:8.3.2-security.2 ../..

      - name: Verify backend
        # Verify tests and packaging with development-only defaults disabled.
        # Retry dependency downloads for both services; test failures still fail immediately.
        run: bash ../../../.github/scripts/maven_with_retry.sh sh ./mvnw -f ../../pom.xml -pl services/${{ matrix.service }} -am -Dspring.devtools.add-properties=false -Dchangeguard.test.postgres-image=changuard-postgres:18.6-security.1 verify

      - name: Upload unit and integration test reports
        # Preserve available results after failures; matrix services need unique names.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ matrix.service }}-test-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
