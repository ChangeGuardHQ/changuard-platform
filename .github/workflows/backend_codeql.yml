name: Backend CodeQL analysis

# backend_ci.yml checks repository eligibility before calling this workflow.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  codeql:
    name: Backend CodeQL analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    defaults:
      run:
        working-directory: backend/services/connector-service
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21.0.12+101.0.LTS" # Temurin 21.0.12.1+1 (Adoptium SemVer)
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: java-kotlin
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.1/codeql-bundle-linux64.tar.gz
          build-mode: manual
          queries: security-extended

      - name: Build for CodeQL
        # Extract both services and their shared dependencies from the same reactor.
        run: sh ./mvnw -f ../../pom.xml --batch-mode --no-transfer-progress -DskipTests clean package

      - name: Analyze Java sources
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:java-kotlin
          output: ${{ github.workspace }}/codeql-results

      - name: Upload CodeQL report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-codeql
          path: codeql-results/*.sarif
          if-no-files-found: warn
          retention-days: 7
