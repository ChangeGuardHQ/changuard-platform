name: Frontend dependency, secret, and configuration scans

# Reusable source-security checks for the frontend; callers decide when to run it.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  source-security:
    name: Frontend dependency, secret, and configuration scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependency vulnerability audit
        # Save the JSON report even when npm audit finds vulnerabilities.
        run: npm audit --audit-level=high --json > npm-audit.json

      - name: Filesystem, secret, and dependency security scan
        # Run after earlier failures as well, so the scan can still produce a report.
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          version: v0.70.0
          scan-ref: frontend
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: frontend-filesystem-security.json

      - name: Scan shared infrastructure configuration
        # Include repository-level configuration, not just files under frontend/.
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          version: v0.70.0
          scan-ref: .
          # Exclude generated dependencies and build output from configuration checks.
          skip-dirs: .cache,frontend/node_modules,frontend/dist,backend/services/connector-service/target
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: frontend-configuration-security.json

      - name: Upload security reports
        # Preserve available reports for review, including when a scan fails.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-source-security
          path: |
            frontend/npm-audit.json
            frontend-*-security.json
          if-no-files-found: warn
          retention-days: 7
