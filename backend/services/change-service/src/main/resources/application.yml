spring:
  application:
    name: change-service

  datasource:
    # Share the PostgreSQL database while keeping change-service objects in their own schema.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/changeguard?currentSchema=change}
    username: ${DB_USERNAME:changeguard}
    password: ${DB_PASSWORD:changeguard-local}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: change
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    # Apply the reviewed domain DDL before Hibernate validates mappings.
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    default-schema: change
    schemas: change
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:change-service-group}

      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        # Preserve original keys and Registry-framed values for lossless quarantine and replay.
        spring.deserializer.key.delegate.class: com.changeguard.change.messaging.PreservingStringDeserializer
        spring.deserializer.value.delegate.class: com.changeguard.change.messaging.PreservingAvroDeserializer
        # Resolve writer schemas from Registry and materialize only the shared generated records.
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8083}
        specific.avro.reader: true

    listener:
      ack-mode: record
      # Pause without changing consumer-group offsets when maintenance is required.
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
        projection:
          # A separate probe lets operators detect stopped projection without draining healthy read APIs.
          include: codeEventConsumer

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.changeguard.change: DEBUG
    org.springframework.web: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
    org.hibernate.SQL: INFO

changeguard:
  api:
    # Empty defaults grant no data access; configure trusted service readers per organization.
    organizations:
      - organization-id: ${CHANGE_ORGANIZATION_ID:}
        readers: ${CHANGE_ORGANIZATION_READERS:}
  kafka:
    recovery:
      # Provision this topic with durable retention and appropriate broker replication before deployment.
      dead-letter-topic: ${CODE_EVENTS_DLT_TOPIC:changeguard.change-service.code-events.v1.dlt}
      retries: ${CODE_EVENTS_RETRIES:3}
      retry-interval: ${CODE_EVENTS_RETRY_INTERVAL:1s}
    topics:
      # Matches the connector's versioned Avro topic and repository partition key.
      code-events: ${CODE_EVENTS_TOPIC:changeguard.code-events.v1}
