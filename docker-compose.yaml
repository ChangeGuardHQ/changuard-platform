services:
  frontend:
    image: changuard-frontend:0.0.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: /api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    networks:
      - changuard_network

  connector-service:
    image: ${CONNECTOR_SERVICE_IMAGE:-changuard-connector-service:0.0.1}
    build:
      context: ./backend/services/connector-service
      dockerfile: Dockerfile
    init: true
    ports:
      - "${CONNECTOR_PORT:-8081}:8081"
    environment:
      SERVER_PORT: "8081"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CODE_EVENTS_TOPIC: ${CODE_EVENTS_TOPIC:-changeguard.code-events}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-change-me}
    depends_on:
      kafka:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - changuard_network

  change-service:
    image: ${CHANGE_SERVICE_IMAGE:-changuard-change-service:0.0.1}
    build:
      context: ./backend/services/change-service
      dockerfile: Dockerfile
    init: true
    ports:
      - "${CHANGE_SERVICE_PORT:-8082}:8082"
    environment:
      SERVER_PORT: "8082"
      DB_URL: jdbc:postgresql://postgres:5432/changeguard_change
      DB_USERNAME: ${CHANGE_DB_USERNAME:-changeguard}
      DB_PASSWORD: ${CHANGE_DB_PASSWORD:-changeguard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CODE_EVENTS_TOPIC: ${CODE_EVENTS_TOPIC:-changeguard.code-events}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-change-service-group}
      SPRING_SECURITY_USER_NAME: ${CHANGE_SERVICE_USER:-changeguard}
      SPRING_SECURITY_USER_PASSWORD: ${CHANGE_SERVICE_PASSWORD:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - changuard_network

  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: changeguard_change
      POSTGRES_USER: ${CHANGE_DB_USERNAME:-changeguard}
      POSTGRES_PASSWORD: ${CHANGE_DB_PASSWORD:-changeguard}
    ports:
      - "127.0.0.1:${CHANGE_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10
    volumes:
      - change_postgres_data:/var/lib/postgresql/data
    networks:
      - changuard_network

  kafka:
    image: ${KAFKA_IMAGE:-changuard-kafka:4.2.2-security.1}
    build:
      context: ./backend/docker/kafka
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - changuard_network

volumes:
  frontend_node_modules:
  kafka_data:
  change_postgres_data:

networks:
  changuard_network:
