# ChangeGuard platform local development stack.
# Starts the frontend, both services, Kafka, PostgreSQL, and Schema Registry for local development.
# The frontend is served locally on port 5173 by default, and the connector service exposes its API on port 8081.

services:
  # Frontend application served as a Vite dev server.
  # Mounts the local frontend source directory so edits are reflected immediately.
  frontend:
    image: changuard-frontend:0.0.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: /api
      # Only the dev server sees internal service targets; API passwords are entered in the browser.
      CHANGE_API_PROXY_TARGET: http://change-service:8082
      CONNECTOR_API_PROXY_TARGET: http://connector-service:8081
      VITE_ORGANIZATION_ID: ${CHANGE_ORGANIZATION_ID:-local}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - changuard_network

  # Connector receives integration events and owns the connector database schema.
  # Database migrations run at startup after PostgreSQL and Kafka become healthy.
  connector-service:
    image: ${CONNECTOR_SERVICE_IMAGE:-changuard-connector-service:0.0.1}
    build:
      context: ./backend
      dockerfile: services/connector-service/Dockerfile
    init: true
    ports:
      - "${CONNECTOR_PORT:-8081}:8081"
    environment:
      SERVER_PORT: "8081"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CODE_EVENTS_TOPIC: ${CODE_EVENTS_TOPIC:-changeguard.code-events.v1}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-change-me}
      # Deploy the lifecycle consumer first, then opt in to opened-PR and branch-push producers.
      GITHUB_CODE_LIFECYCLE_ENABLED: ${GITHUB_CODE_LIFECYCLE_ENABLED:-false}
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_ACKNOWLEDGEMENT_TIMEOUT: ${OUTBOX_ACKNOWLEDGEMENT_TIMEOUT:-10s}
      OUTBOX_LEASE_DURATION: ${OUTBOX_LEASE_DURATION:-60s}
      OUTBOX_RETRY_INITIAL_DELAY: ${OUTBOX_RETRY_INITIAL_DELAY:-1s}
      OUTBOX_RETRY_MAX_DELAY: ${OUTBOX_RETRY_MAX_DELAY:-30s}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-changeguard}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-changeguard}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeguard-local}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - changuard_network

  # Change Service projects canonical Avro code lifecycle facts into its organization-scoped PostgreSQL schema.
  change-service:
    image: ${CHANGE_SERVICE_IMAGE:-changuard-change-service:0.0.1}
    build:
      context: ./backend
      dockerfile: services/change-service/Dockerfile
    init: true
    ports:
      - "${CHANGE_SERVICE_PORT:-8082}:8082"
    environment:
      SERVER_PORT: "8082"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-changeguard}?currentSchema=change
      DB_USERNAME: ${POSTGRES_USER:-changeguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeguard-local}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_LISTENER_AUTO_STARTUP: ${KAFKA_LISTENER_AUTO_STARTUP:-true}
      # Development read binding is explicit; hosted deployments configure their own organization readers.
      CHANGE_ORGANIZATION_ID: ${CHANGE_ORGANIZATION_ID:-local}
      CHANGE_ORGANIZATION_READERS: ${CHANGE_ORGANIZATION_READERS:-${CHANGE_SERVICE_USER:-changeguard}}
      CODE_EVENTS_TOPIC: ${CODE_EVENTS_TOPIC:-changeguard.code-events.v1}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-change-service-group}
      SPRING_SECURITY_USER_NAME: ${CHANGE_SERVICE_USER:-changeguard}
      SPRING_SECURITY_USER_PASSWORD: ${CHANGE_SERVICE_PASSWORD:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - changuard_network

  # PostgreSQL 18 stores version-specific data below /var/lib/postgresql.
  postgres:
    image: ${POSTGRES_IMAGE:-changuard-postgres:18.6-security.1}
    build:
      context: ./backend/docker/postgres
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-changeguard}
      POSTGRES_USER: ${POSTGRES_USER:-changeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeguard-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    networks:
      - changuard_network

  # Local Kafka broker used for event-driven communication between services.
  # The container exposes a localhost listener for local clients and an internal listener for service-to-service traffic.
  kafka:
    image: ${KAFKA_IMAGE:-changuard-kafka:4.2.2-security.2}
    build:
      context: ./backend/docker/kafka
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - changuard_network

  # Schema history is durable in Kafka's compacted _schemas topic, not local files.
  schema-registry:
    image: ${SCHEMA_REGISTRY_IMAGE:-changuard-schema-registry:8.3.2-security.2}
    build:
      context: ./backend
      dockerfile: docker/schema-registry/Dockerfile
    ports:
      # Reserve 8082 for Change Service; internal Registry clients still use port 8081.
      - "127.0.0.1:${SCHEMA_REGISTRY_PORT:-8083}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "1"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - changuard_network

# Named volumes retain frontend dependencies and Kafka/PostgreSQL data.
volumes:
  frontend_node_modules:
  kafka_data:
  postgres_data:

# Shared internal Docker network for local service discovery.
networks:
  changuard_network:
