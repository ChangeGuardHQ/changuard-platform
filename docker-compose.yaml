# ChangeGuard platform local development stack.
# Starts the frontend, connector, Kafka, and PostgreSQL for local development.
# The frontend is served locally on port 5173 by default, and the connector service exposes its API on port 8081.

services:
  # Frontend application served as a Vite dev server.
  # Mounts the local frontend source directory so edits are reflected immediately.
  frontend:
    image: changuard-frontend:0.0.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: /api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - changuard_network

  # Connector receives integration events and owns the connector database schema.
  # Database migrations run at startup after PostgreSQL and Kafka become healthy.
  connector-service:
    image: ${CONNECTOR_SERVICE_IMAGE:-changuard-connector-service:0.0.1}
    build:
      context: ./backend/services/connector-service
      dockerfile: Dockerfile
    init: true
    ports:
      - "${CONNECTOR_PORT:-8081}:8081"
    environment:
      SERVER_PORT: "8081"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CODE_EVENTS_TOPIC: ${CODE_EVENTS_TOPIC:-changeguard.code-events}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-change-me}
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_ACKNOWLEDGEMENT_TIMEOUT: ${OUTBOX_ACKNOWLEDGEMENT_TIMEOUT:-10s}
      OUTBOX_LEASE_DURATION: ${OUTBOX_LEASE_DURATION:-60s}
      OUTBOX_RETRY_INITIAL_DELAY: ${OUTBOX_RETRY_INITIAL_DELAY:-1s}
      OUTBOX_RETRY_MAX_DELAY: ${OUTBOX_RETRY_MAX_DELAY:-30s}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-changeguard}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-changeguard}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeguard-local}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - changuard_network

  # PostgreSQL 18 stores version-specific data below /var/lib/postgresql.
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-changeguard}
      POSTGRES_USER: ${POSTGRES_USER:-changeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeguard-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    networks:
      - changuard_network

  # Local Kafka broker used for event-driven communication between services.
  # The container exposes a localhost listener for local clients and an internal listener for service-to-service traffic.
  kafka:
    image: ${KAFKA_IMAGE:-changuard-kafka:4.2.2-security.1}
    build:
      context: ./backend/docker/kafka
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - changuard_network

# Named volumes retain frontend dependencies and Kafka/PostgreSQL data.
volumes:
  frontend_node_modules:
  kafka_data:
  postgres_data:

# Shared internal Docker network for local service discovery.
networks:
  changuard_network:
